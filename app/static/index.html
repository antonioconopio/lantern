<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lantern</title>
<style>
  :root {
    --bg: #faf9f7; --panel: #fff; --ink: #1c1b19; --muted: #77746d; --line: #e6e3dc;
    --accent: #c2410c; --accent-ink: #fff; --chip: #f1eee8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151413; --panel: #1e1d1b; --ink: #f0eee9; --muted: #98948b; --line: #2e2c29;
            --accent: #f97316; --accent-ink: #151413; --chip: #292724; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; overflow: hidden; display: grid; grid-template-rows: 100%; grid-template-columns: 280px 1fr;
         background: var(--bg); color: var(--ink);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  aside { border-right: 1px solid var(--line); padding: 20px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }
  h1 { margin: 0; font-size: 20px; letter-spacing: -.01em; }
  h1 span { color: var(--accent); }
  .tag { color: var(--muted); font-size: 13px; margin-top: 2px; }
  h2 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .drop { border: 1.5px dashed var(--line); border-radius: 10px; padding: 16px; text-align: center;
          color: var(--muted); cursor: pointer; font-size: 13px; }
  .drop:hover, .drop.over { border-color: var(--accent); color: var(--ink); }
  .doc { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--panel);
         border: 1px solid var(--line); border-radius: 8px; font-size: 13px; }
  .doc .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .doc .n { color: var(--muted); font-size: 12px; }
  .doc button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 16px; padding: 0 2px; }
  .doc button:hover { color: var(--accent); }
  .empty { color: var(--muted); font-size: 13px; }
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; border-bottom: 1px solid var(--line); }
  .seg { display: inline-flex; background: var(--chip); border-radius: 8px; padding: 3px; }
  .seg button { border: 0; background: none; color: var(--muted); padding: 5px 14px; border-radius: 6px; cursor: pointer; font: inherit; font-size: 13px; }
  .seg button.on { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .link { border: 0; background: none; color: var(--muted); cursor: pointer; font: inherit; font-size: 13px; }
  .link:hover { color: var(--ink); }
  #log { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 18px; }
  .msg { max-width: 760px; width: 100%; margin: 0 auto; }
  .q { background: var(--chip); padding: 10px 14px; border-radius: 12px; align-self: flex-end; width: fit-content; max-width: 80%; margin-right: 0; margin-left: auto; }
  .a { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; white-space: pre-wrap; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--muted); }
  .chip.tool { color: var(--accent); }
  .chip.warn { color: #b45309; }
  .src { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  .src b { color: var(--ink); font-weight: 600; }
  .src div { margin-top: 6px; }
  .hint { margin: auto; text-align: center; color: var(--muted); max-width: 420px; }
  form { display: flex; gap: 10px; padding: 16px 24px 24px; max-width: 808px; width: 100%; margin: 0 auto; }
  input[type=text] { flex: 1; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: inherit; }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  form button { padding: 0 20px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 600; cursor: pointer; }
  form button:disabled { opacity: .5; cursor: default; }
  @media (max-width: 720px) { body { grid-template-columns: 1fr; grid-template-rows: auto; height: auto; overflow: visible; } main { height: 100vh; } aside { border-right: 0; border-bottom: 1px solid var(--line); } }
</style>
</head>
<body>
<aside>
  <div><h1><span>●</span> Lantern</h1><div class="tag">Ask your documents, with citations.</div></div>
  <label class="drop" id="drop">Drop a PDF, .md or .txt<br>or click to upload
    <input type="file" id="file" accept=".pdf,.md,.txt" hidden multiple>
  </label>
  <h2>Documents</h2>
  <div id="docs" style="display:flex;flex-direction:column;gap:8px"></div>
</aside>
<main>
  <header>
    <div class="seg" id="mode">
      <button data-m="rag" class="on" title="Fixed rewrite → retrieve → answer">RAG</button>
      <button data-m="agent" title="Model chooses its own tool calls">Agent</button>
    </div>
    <button class="link" id="new">New conversation</button>
  </header>
  <div id="log"><div class="hint" id="hint">Upload a document, then ask a question. Switch to <b>Agent</b> to watch the model choose its own searches and calculator calls.</div></div>
  <form id="form">
    <input type="text" id="q" placeholder="Ask a question…" autocomplete="off" maxlength="2000">
    <button id="send">Ask</button>
  </form>
</main>
<script>
const $ = id => document.getElementById(id);
let mode = "rag", session = null;
const hint = $("hint");

const toBottom = () => $("log").scrollTo({ top: $("log").scrollHeight, behavior: "smooth" });
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

async function loadDocs() {
  const docs = await (await fetch("/documents")).json();
  const box = $("docs"); box.replaceChildren();
  if (!docs.length) box.append(el("div", "empty", "Nothing uploaded yet."));
  for (const d of docs) {
    const row = el("div", "doc");
    const del = el("button", null, "×"); del.title = "Remove";
    del.onclick = async () => { await fetch(`/documents/${d.id}`, { method: "DELETE" }); loadDocs(); };
    row.append(el("span", "name", d.filename), el("span", "n", `${d.chunks} chunks`), del);
    box.append(row);
  }
}

async function upload(files) {
  for (const f of files) {
    const body = new FormData(); body.append("file", f);
    $("drop").firstChild.textContent = `Uploading ${f.name}…`;
    const r = await fetch("/documents", { method: "POST", body });
    if (!r.ok) alert((await r.json()).detail || "Upload failed");
  }
  $("drop").firstChild.textContent = "Drop a PDF, .md or .txt";
  loadDocs();
}
$("file").onchange = e => { upload([...e.target.files]); e.target.value = ""; };
$("drop").ondragover = e => { e.preventDefault(); $("drop").classList.add("over"); };
$("drop").ondragleave = () => $("drop").classList.remove("over");
$("drop").ondrop = e => { e.preventDefault(); $("drop").classList.remove("over"); upload([...e.dataTransfer.files]); };

$("mode").onclick = e => {
  if (!e.target.dataset.m) return;
  mode = e.target.dataset.m;
  [...$("mode").children].forEach(b => b.classList.toggle("on", b === e.target));
};
$("new").onclick = async () => {
  if (session) await fetch(`/sessions/${session}`, { method: "DELETE" });
  session = null; $("log").replaceChildren(hint);
};

function render(r) {
  const box = el("div", "msg a", r.answer);
  const meta = el("div", "meta");
  meta.append(el("span", "chip", r.mode === "agent" ? "agent" : "rag"), el("span", "chip", `confidence: ${r.confidence}`));
  if (!r.answerable) meta.append(el("span", "chip warn", "not in documents"));
  for (const s of r.steps) {
    const arg = Object.values(s.input)[0];
    meta.append(el("span", "chip tool", `${s.tool}(${typeof arg === "string" ? JSON.stringify(arg) : ""})`));
  }
  box.append(meta);
  if (r.sources.length) {
    const src = el("div", "src");
    for (const s of r.sources) {
      const line = el("div"); line.append(el("b", null, `[${s.index}] ${s.document}, p.${s.page}`), document.createTextNode(` — ${s.snippet.slice(0, 160)}…`));
      src.append(line);
    }
    box.append(src);
  }
  return box;
}

$("form").onsubmit = async e => {
  e.preventDefault();
  const question = $("q").value.trim(); if (!question) return;
  hint.remove(); $("q").value = ""; $("send").disabled = true;
  const log = $("log");
  log.append(el("div", "msg q", question));
  const pending = el("div", "msg a", "Thinking…"); log.append(pending);
  toBottom();
  try {
    const r = await fetch("/ask", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, mode, session_id: session }) });
    if (!r.ok) throw new Error(`${r.status} ${(await r.text()).slice(0, 200)}`);
    const data = await r.json(); session = data.session_id;
    pending.replaceWith(render(data));
  } catch (err) { pending.textContent = `Error: ${err.message}`; }
  $("send").disabled = false; toBottom(); $("q").focus();
};

loadDocs();
</script>
</body>
</html>
